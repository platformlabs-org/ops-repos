name: Sync Subdirectories To Targets

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: "Subdirectory to sync (all/whql/dua/sign/bsod/windows-update)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  sync-to-target:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: whql
            repo: ops.platformlabs.lenovo.com/platform-drivers/whql
          - dir: dua
            repo: ops.platformlabs.lenovo.com/platform-drivers/dua
          - dir: sign
            repo: ops.platformlabs.lenovo.com/platform-drivers/sign
          - dir: bsod
            repo: ops.platformlabs.lenovo.com/operations/bsod
          - dir: windows-update
            repo: ops.platformlabs.lenovo.com/platform-drivers/windows-update
    steps:
      - uses: actions/checkout@v4

      - name: Sync to target repo and create PR
        if: ${{ github.event.inputs.target_dir == 'all' || github.event.inputs.target_dir == matrix.dir || github.event.inputs.target_dir == '' }}
        env:
          USERNAME: bot
          TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          DIR: ${{ matrix.dir }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ ! -d "$DIR" ]; then
            echo "Directory $DIR does not exist. Skipping."
            exit 0
          fi

          WORK_DIR=$(mktemp -d)
          REMOTE_URL="https://${USERNAME}:${TOKEN}@${TARGET_REPO}"
          API_BASE="https://${USERNAME}:${TOKEN}@${TARGET_REPO%%/*}/api/v1"
          OWNER_REPO="${TARGET_REPO#*/}"
          OWNER="${OWNER_REPO%%/*}"
          REPO_NAME="${OWNER_REPO##*/}"
          BRANCH="sync/${DIR}-from-monorepo-${RUN_ID}"

          echo "Cloning ${TARGET_REPO}"
          git clone "$REMOTE_URL" "$WORK_DIR"
          cd "$WORK_DIR"

          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

          git checkout -B "$BRANCH" origin/main

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r "${GITHUB_WORKSPACE}/$DIR"/. .

          git add -A
          if git diff --cached --quiet; then
            echo "No changes detected for $DIR."
            exit 0
          fi

          git commit -m "sync(${DIR}): update from monorepo"
          git push "$REMOTE_URL" "$BRANCH"

          PR_TITLE="sync(${DIR}): update from monorepo"
          PR_BODY="Automated sync from ${GITHUB_REPOSITORY}/${DIR}. Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"

          EXISTING=$(curl -sS "$API_BASE/repos/$OWNER/$REPO_NAME/pulls?state=open&base=main&head=$OWNER:$BRANCH" | jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "PR already exists for ${OWNER}/${REPO_NAME}:${BRANCH}"
            exit 0
          fi

          curl -sS -X POST "$API_BASE/repos/$OWNER/$REPO_NAME/pulls" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"${PR_TITLE}\",\"head\":\"${BRANCH}\",\"base\":\"main\",\"body\":\"${PR_BODY}\"}" >/dev/null

          echo "PR created for ${OWNER}/${REPO_NAME}"
